<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1114">
<title>Gold desk</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1114;--slab:#121a1f;--slab2:#18232a;--line:#23323a;--line2:#2f434d;--bone:#efe9d9;--mute:#8d9ca3;--dim:#5d6e76;--gold:#e4b24c;--gold2:#b98a2a;--gold3:#f6dc9a;--long:#46c8aa;--short:#ee6c5f;--silver:#a9c0cf;--bronze:#c48a57;--warn:#f0a53a;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--ink)}
body{color:var(--bone);font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(520px 340px at 0% -8%,rgba(228,178,76,.13),transparent 62%),radial-gradient(420px 360px at 100% 105%,rgba(70,200,170,.07),transparent 60%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px;position:relative}
.serif{font-family:'Fraunces',Georgia,serif}
/* header */
.top{padding:calc(14px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;gap:10px}
.bar{width:30px;height:20px;clip-path:polygon(14% 0,86% 0,100% 100%,0 100%);background:linear-gradient(160deg,var(--gold3),var(--gold) 45%,var(--gold2));box-shadow:0 0 18px rgba(228,178,76,.45);animation:glint 5s var(--ease) infinite}
@keyframes glint{0%,70%,100%{filter:brightness(1)}80%{filter:brightness(1.45)}}
.top h1{font:600 20px/1 'Fraunces',serif}.top small{display:block;color:var(--mute);font-size:11.5px;margin-top:3px}
.chip{margin-left:auto;display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);background:var(--slab);font-size:12.5px;color:var(--mute);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.chip.live{color:var(--long);border-color:rgba(70,200,170,.4)}.chip.live i{background:var(--long);animation:pulse 1.6s infinite}
.chip.warn{color:var(--warn);border-color:rgba(240,165,58,.45)}.chip.warn i{background:var(--warn)}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
/* summary */
.sum{display:flex;align-items:flex-end;gap:14px;padding:6px 2px 14px;flex-wrap:wrap}
.price{font:600 34px/1 'Fraunces',serif;letter-spacing:-.3px}.price small{display:block;font:400 11.5px 'IBM Plex Sans';color:var(--mute);letter-spacing:0;margin-bottom:5px}
.counts{margin-left:auto;display:flex;gap:8px}
.cnt{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--mute)}.cnt b{font-size:15px;color:var(--bone)}
.sess{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.pill{height:24px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);font-size:12px;color:var(--dim);display:inline-flex;align-items:center}
.pill.on{color:var(--bone);border-color:var(--gold);background:rgba(228,178,76,.12)}
.banner{border:1px solid rgba(240,165,58,.45);background:rgba(240,165,58,.08);color:var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
/* ingot */
.ingot{display:inline-grid;place-items:center;width:42px;height:32px;clip-path:polygon(14% 0,86% 0,100% 100%,0 100%);font:600 17px 'Fraunces',serif;color:#1d1505;flex:none}
.gA{background:linear-gradient(160deg,var(--gold3),var(--gold) 50%,var(--gold2))}.gB{background:linear-gradient(160deg,#e3eef5,var(--silver) 55%,#7f98a8)}.gC{background:linear-gradient(160deg,#e3b78d,var(--bronze) 55%,#8c5e36)}.gX{background:#2a3a43;color:var(--mute)}
.ingot.sm{width:30px;height:23px;font-size:13px}
.anim .stamp{animation:stamp .7s var(--spring) both}
@keyframes stamp{0%{transform:scale(1.9) rotate(-8deg);opacity:0}60%{opacity:1}100%{transform:none}}
/* cards */
.card{background:linear-gradient(180deg,var(--slab),#10181d);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;transition:border-color .3s,box-shadow .3s}
.card.open{border-color:var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card.gradeA.open{border-color:rgba(228,178,76,.55)}
.head{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;transition:background .2s}
.head:active{background:rgba(255,255,255,.04)}
.who{min-width:0;flex:1}.who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{color:var(--mute);font-size:12.5px}
.buy{color:var(--long)}.sell{color:var(--short)}
.prob{text-align:right}.prob b{font:600 22px/1 'Fraunces',serif}.prob small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.card.open .more{grid-template-rows:1fr}
.more>div{overflow:hidden}.inner{padding:2px 14px 16px;border-top:1px solid var(--line)}
.sec{margin-top:14px}.sec h3{font-size:12.5px;font-weight:500;color:var(--mute);margin-bottom:7px}
.ladder{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line)}
.ladder i{display:block;height:100%;transform-origin:left}.ladder .r{background:var(--short)}.ladder .w{background:var(--long)}
@keyframes grow{from{transform:scaleX(0)}}
.lv{display:flex;justify-content:space-between;margin-top:7px;font-size:12.5px}.lv span{display:block;color:var(--mute);font-size:11.5px}.lv div:nth-child(2){text-align:center}.lv div:last-child{text-align:right}
.meter{position:relative;height:10px;border-radius:6px;background:var(--line)}
.meter .band{position:absolute;top:0;bottom:0;background:rgba(228,178,76,.25);border-radius:6px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--gold2),var(--gold));transform-origin:left}
.meter .be{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bone);border-radius:2px}
.mlabel{display:flex;justify-content:space-between;color:var(--mute);font-size:11.5px;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--slab2);border-radius:10px;padding:9px 11px}.stat span{display:block;color:var(--mute);font-size:11.5px}.stat b{font-size:15px}
.pos{color:var(--long)}.neg{color:var(--short)}
.part{display:grid;grid-template-columns:92px 1fr 44px;gap:8px;align-items:center;font-size:12.5px;margin-bottom:5px;color:var(--mute)}
.part .t{height:6px;border-radius:4px;background:var(--line);overflow:hidden}.part .t i{display:block;height:100%;background:var(--gold);transform-origin:left}
.card.open .ladder i,.card.open .meter .fill,.card.open .part .t i{animation:grow .8s var(--ease) both}.part em{font-style:normal;text-align:right;color:var(--bone)}
.note{color:var(--warn);font-size:12.5px;margin-top:8px}
.empty{text-align:center;padding:40px 18px;color:var(--mute)}.empty .ingot{opacity:.35;margin-bottom:12px}.empty b{display:block;color:var(--bone);font:600 17px 'Fraunces',serif;margin-bottom:5px}
/* backtests */
.mx{display:grid;grid-template-columns:96px repeat(5,1fr);gap:6px;align-items:center;margin-bottom:12px}
.mx .h{color:var(--mute);font-size:12px;text-align:center}.mx .n{font-size:12.5px;line-height:1.2;color:var(--bone)}
.cell{height:40px;border-radius:9px;background:var(--slab);border:1px solid var(--line);display:grid;place-items:center;transition:transform .2s var(--spring),border-color .2s}
.cell:active{transform:scale(.92)}.cell.sel{border-color:var(--gold);box-shadow:0 0 14px rgba(228,178,76,.25)}.cell.off{opacity:.35;pointer-events:none}.cell.sig{outline:1px dashed var(--gold);outline-offset:2px}
.detail{animation:rise .35s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel{background:linear-gradient(180deg,var(--slab),#10181d);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}.row:last-child{border:0}.row .k{flex:1;color:var(--mute)}
.tr{position:relative;height:6px;width:90px;border-radius:4px;background:var(--line)}.tr i{position:absolute;top:0;bottom:0;border-radius:4px}.tr:before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--dim)}
.fine{color:var(--dim);font-size:12px;padding:6px 4px 16px}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(11,17,20,.9);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);position:relative}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;color:var(--mute);font-size:12px;transition:color .2s,transform .15s var(--spring)}
.tab:active{transform:scale(.94)}.tab.on{color:var(--bone)}.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab .dot{position:absolute;margin:-3px 0 0 16px;min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:#241a06;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.ind{position:absolute;top:-1px;height:2px;width:33.333%;background:var(--gold);box-shadow:0 0 12px var(--gold);transition:transform .45s var(--spring)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="bar"></div><div><h1>Gold desk</h1><small>XAUUSD setup scanner</small></div><span class="chip" id="chip"><i></i><span>Loading</span></span></header>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs">
  <button class="tab on" data-tab="setups"><svg viewBox="0 0 24 24"><path d="M4 18 9 11l4 4 7-9"/><path d="M15 6h5v5"/></svg>Setups</button>
  <button class="tab" data-tab="tests"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M10 4v16"/></svg>Backtests</button>
  <button class="tab" data-tab="market"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Market</button>
  <div class="ind" id="ind"></div>
</div></nav>
<script>
'use strict';
const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tgw = window.Telegram && window.Telegram.WebApp;
if (tgw) { try { tgw.ready(); tgw.expand(); tgw.setHeaderColor('#0b1114'); tgw.setBackgroundColor('#0b1114'); } catch (e) { } }
const tap = () => { try { tgw && tgw.HapticFeedback && tgw.HapticFeedback.selectionChanged(); } catch (e) { } };
const thud = () => { try { tgw && tgw.HapticFeedback && tgw.HapticFeedback.impactOccurred('light'); } catch (e) { } };

const num = (x, d = 2) => Number(x).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const pc = x => Math.round(x * 100) + '%', sg = x => (x >= 0 ? '+' : '') + x.toFixed(2);
const ago = s => { s = Math.max(0, Math.round(s)); return s < 90 ? 'just now' : s < 5400 ? Math.round(s / 60) + ' min ago' : s < 172800 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' days ago'; };
const S = { d: null, tab: 'setups', open: null, cell: null, err: '', anim: true };

/* ---------- data ---------- */
function sources() {
  const q = new URLSearchParams(location.search), list = [];
  if (q.get('data')) list.push(q.get('data'));
  const m = /^([^.]+)\.github\.io$/.exec(location.hostname), repo = location.pathname.split('/')[1];
  if (m && repo) list.push(`https://raw.githubusercontent.com/${m[1]}/${repo}/data/latest.json`);
  list.push('latest.json');
  return list;
}
async function load() {
  for (const u of sources()) {
    try { const r = await fetch(u + (u.includes('?') ? '&' : '?') + 't=' + Math.floor(Date.now() / 60000), { cache: 'no-store' }); if (!r.ok) continue; const d = await r.json(); if (d && d.updated) { const same = S.d && S.d.updated === d.updated; S.d = d; S.err = ''; return same ? refreshAge() : (S.anim = true, render()); } } catch (e) { }
  }
  S.err = S.d ? '' : 'The scanner has not published results yet. After the first scan finishes this page fills in by itself.'; render();
}

/* ---------- render ---------- */
const tfl = d => id => (d.tfLabels && d.tfLabels[id]) || id;
function refreshAge() {
  const d = S.d; if (!d || !d.marketOpen) return; const age = Date.now() / 1000 - d.updated, late = age > 1200;
  chip(late ? 'warn' : 'live', late ? 'Scan delayed' : 'Live scan'); const f = $('.fine'); if (f) f.innerHTML = fine(d, age);
  if (late && !$('.banner')) render();
}
const fine = (d, age) => `Backtested signals, not financial advice. Checked ${ago(age)}. Probabilities are shrunk toward break-even, so they stay modest on thin evidence.`;
function render() {
  const d = S.d, v = $('#view'); v.className = S.anim ? 'anim' : '';
  if (!d || d.status === 'warming') { v.innerHTML = `<div class="empty"><div class="ingot gX">?</div><b>${d ? 'Collecting history' : 'Waiting for the first scan'}</b>${esc(d ? d.note : S.err)}</div>`; chip('warn', 'Waiting'); return; }
  const age = Date.now() / 1000 - d.updated, late = d.marketOpen && age > 1200;
  chip(!d.marketOpen ? 'warn' : late ? 'warn' : 'live', !d.marketOpen ? 'Market closed' : late ? 'Scan delayed' : 'Live scan');
  const c = d.counts, ses = ['Asia', 'London', 'New York'];
  let h = '';
  if (late) h += `<div class="banner">The last scan finished ${ago(age)}. GitHub can delay scheduled runs, so setups below may be out of date.</div>`;
  if (d.event) h += `<div class="banner">Event window: ${esc(d.event.title)}. Grades are capped at B until it passes.</div>`;
  h += `<div class="sum"><div class="price"><small>Reference price at last scan</small>${num(d.price)}</div><div class="counts">${['A', 'B', 'C'].map(g => `<div class="cnt"><span class="ingot sm g${g}">${g}</span><b>${c[g]}</b></div>`).join('')}</div></div>`;
  h += `<div class="sess">${ses.map(s => `<span class="pill ${d.sessions.includes(s) ? 'on' : ''}">${s}</span>`).join('')}</div>`;
  h += S.tab === 'setups' ? setups(d) : S.tab === 'tests' ? tests(d) : market(d);
  h += `<p class="fine">${fine(d, age)}</p>`;
  v.innerHTML = h; bind(); S.anim = false;
  const n = d.setups.filter(s => s.grade === 'A' || s.grade === 'B').length; let dot = $('.tab[data-tab=setups] .dot'); if (dot) dot.remove(); if (n) $('.tab[data-tab=setups]').insertAdjacentHTML('beforeend', `<span class="dot">${n}</span>`);
}
function chip(k, t) { const e = $('#chip'); e.className = 'chip ' + k; e.lastElementChild.textContent = t; }

function setups(d) {
  if (!d.setups.length) return `<div class="empty"><div class="ingot gX">A</div><b>No active setups</b>The scanner checks all six strategies on five timeframes every 5 minutes. You will get a Telegram message when an A or B setup appears.</div>`;
  const L = tfl(d);
  return d.setups.map((s, i) => {
    const risk = Math.abs(s.entry - s.sl), rew = Math.abs(s.tp - s.entry), tot = risk + rew, open = S.open === s.id;
    const evClass = s.evR >= 0 ? 'pos' : 'neg';
    const parts = [['edge', 'Edge', 35], ['prob', 'Probability', 20], ['sample', 'Sample size', 15], ['oos', 'Out of sample', 15], ['mtf', 'Higher timeframes', 10], ['regime', 'Regime fit', 5]];
    return `<article class="card grade${s.grade} ${open ? 'open' : ''}" data-id="${esc(s.id)}">
<button class="head" aria-expanded="${open}"><span class="ingot g${s.grade} ${open ? '' : 'stamp'}" style="animation-delay:${i * 90}ms">${s.grade}</span>
<span class="who"><b>${esc(s.strat)}</b><small><span class="${s.dir > 0 ? 'buy' : 'sell'}">${s.dir > 0 ? 'Buy' : 'Sell'}</span> on ${esc(L(s.tf))} · score ${s.score}</small></span>
<span class="prob"><b>${pc(s.pWin)}</b><small>win chance</small></span></button>
<div class="more"><div><div class="inner">
<div class="sec"><h3>Trade levels</h3><div class="ladder"><i class="r" style="width:${risk / tot * 100}%"></i><i class="w" style="width:${rew / tot * 100}%"></i></div>
<div class="lv"><div>${num(s.sl)}<span>Stop</span></div><div>${num(s.entry)}<span>Entry</span></div><div>${num(s.tp)}<span>Target, ${s.rr.toFixed(1)} to 1</span></div></div></div>
<div class="sec"><h3>Win probability against break-even</h3><div class="meter"><div class="band" style="left:${s.lo * 100}%;width:${(s.hi - s.lo) * 100}%"></div><div class="fill" style="width:${s.pWin * 100}%"></div><div class="be" style="left:${s.be * 100}%"></div></div>
<div class="mlabel"><span>Break-even ${pc(s.be)}</span><span>Raw win rate ${pc(s.wr)} (${pc(s.lo)} to ${pc(s.hi)})</span></div></div>
<div class="sec grid"><div class="stat"><span>Expectancy</span><b class="${evClass}">${sg(s.evR)}R</b></div><div class="stat"><span>Historical trades</span><b>${s.n}</b></div><div class="stat"><span>Out of sample</span><b class="${s.oosExp >= 0 ? 'pos' : 'neg'}">${sg(s.oosExp)}R</b> <span>${s.oosN} trades</span></div><div class="stat"><span>Profit factor</span><b>${s.pf.toFixed(2)}</b></div></div>
<div class="sec"><h3>How the grade was earned</h3>${parts.map(([k, n, m]) => `<div class="part"><span>${n}</span><div class="t"><i style="width:${(s.parts[k] || 0) / m * 100}%"></i></div><em>${Math.round(s.parts[k] || 0)}/${m}</em></div>`).join('')}</div>
${(s.notes || []).map(n => `<p class="note">${esc(n)}</p>`).join('')}
</div></div></div></article>`;
  }).join('');
}

function tests(d) {
  const L = tfl(d), tfs = Object.keys(d.tfLabels), by = {}; d.matrix.forEach(c => by[c.tf + ':' + c.strat] = c);
  let h = `<div class="mx"><span></span>${tfs.map(t => `<span class="h">${esc(L(t))}</span>`).join('')}`;
  for (const st of d.strategies) {
    h += `<span class="n">${esc(st.name)}</span>`;
    for (const t of tfs) { const c = by[t + ':' + st.id], k = t + ':' + st.id; h += c ? `<button class="cell ${S.cell === k ? 'sel' : ''} ${c.sig ? 'sig' : ''}" data-cell="${k}" aria-label="${esc(st.name)} ${esc(L(t))} grade ${c.grade}"><span class="ingot sm g${c.grade}">${c.grade}</span></button>` : `<span class="cell off"><span class="h">-</span></span>`; }
  }
  h += '</div>';
  const c = S.cell && by[S.cell];
  if (c) { const st = d.strategies.find(x => x.id === c.strat); h += `<div class="panel detail"><div style="display:flex;gap:12px;align-items:center;margin-bottom:10px"><span class="ingot g${c.grade}">${c.grade}</span><div><b>${esc(st.name)} on ${esc(L(c.tf))}</b><br><small style="color:var(--mute)">Score ${c.score}. Stop ${st.sl} ATR, target ${st.tp} ATR.${c.sig ? ' Signal active now.' : ''}</small></div></div>
<div class="grid"><div class="stat"><span>Win probability</span><b>${pc(c.pWin)}</b></div><div class="stat"><span>Raw win rate</span><b>${pc(c.wr)}</b></div><div class="stat"><span>Expectancy</span><b class="${c.exp >= 0 ? 'pos' : 'neg'}">${sg(c.exp)}R</b></div><div class="stat"><span>Trades</span><b>${c.n}</b></div><div class="stat"><span>Out of sample</span><b class="${c.oosExp >= 0 ? 'pos' : 'neg'}">${sg(c.oosExp)}R</b> <span>${c.oosN} trades</span></div></div></div>`; }
  else h += `<p class="fine">Tap a square to see its backtest. A dashed outline means a signal is live on that strategy right now. Costs of ${d.cost} per ounce are included.</p>`;
  return h;
}

function market(d) {
  const L = tfl(d);
  let h = `<div class="panel"><div class="sec" style="margin:0"><h3>Timeframes</h3></div>${Object.keys(d.tfs).map(id => { const t = d.tfs[id], w = Math.abs(t.trend) * 50; return `<div class="row"><span class="k">${esc(L(id))}</span><div class="tr"><i style="${t.trend >= 0 ? 'left:50%' : 'right:50%'};width:${w}%;background:${t.trend >= 0 ? 'var(--long)' : 'var(--short)'}"></i></div><span style="width:62px;text-align:right">RSI ${Math.round(t.rsi)}</span><span style="width:62px;text-align:right">ADX ${Math.round(t.adx)}</span></div>`; }).join('')}</div>`;
  h += `<div class="panel"><div class="sec" style="margin:0"><h3>Key levels</h3></div>${d.levels.map(l => `<div class="row"><span class="k">${esc(l.n)}</span><span>${num(l.v)}</span></div>`).join('')}</div>`;
  return h;
}

function bind() {
  document.querySelectorAll('.head').forEach(b => b.onclick = () => {
    const card = b.closest('.card'), id = card.dataset.id, was = S.open === id; tap();
    document.querySelectorAll('.card.open').forEach(c => { c.classList.remove('open'); c.querySelector('.head').setAttribute('aria-expanded', 'false'); });
    S.open = was ? null : id; if (!was) { card.classList.add('open'); b.setAttribute('aria-expanded', 'true'); setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 120); }
  });
  document.querySelectorAll('[data-cell]').forEach(b => b.onclick = () => { S.cell = S.cell === b.dataset.cell ? null : b.dataset.cell; tap(); render(); });
}
function setTab(t, quiet) {
  S.tab = t; S.anim = true; const names = ['setups', 'tests', 'market'];
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('#ind').style.transform = `translateX(${names.indexOf(t) * 100}%)`;
  if (!quiet) { thud(); window.scrollTo({ top: 0, behavior: 'smooth' }); } render();
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));
setTab('setups', true); load(); setInterval(load, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(refreshAge, 30000);
