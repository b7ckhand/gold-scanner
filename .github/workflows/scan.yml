name: scan

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore candle history
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: candles-${{ github.run_id }}
          restore-keys: candles-

      - name: Scan
        run: node scan/index.js
        env:
          TWELVEDATAKEY: ${{ secrets.TWELVEDATAKEY }}
          TELEGRAMTOKEN: ${{ secrets.TELEGRAMTOKEN }}
          TELEGRAMCHATID: ${{ secrets.TELEGRAMCHATID }}

      - name: Save candle history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: candles-${{ github.run_id }}

      - name: Publish results
        run: |
          if [ ! -f out/latest.json ]; then echo "Nothing to publish"; exit 0; fi
          cd out
          git init -q -b data
          git config user.name "gold-scanner"
          git config user.email "gold-scanner@users.noreply.github.com"
          git add latest.json
          git commit -q -m "Scan results"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
